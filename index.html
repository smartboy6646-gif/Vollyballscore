<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pro Volleyball Neon Scoreboard</title>
<style>
:root {
  /* Default Colors (Changeable in App) */
  --bg-left: #4ade80; 
  --bg-right: #f87171; 
  
  --text-light: #ffffff;
  --pill-bg: rgba(255, 255, 255, 0.95);
  --pill-shadow: 0 8px 16px rgba(0,0,0,0.3);
  --icon-color: #374151;
  --accent: #22d3a7;
  
  /* Dynamic Streak Glow Variables */
  --streak-glow-a: 0px;
  --streak-glow-b: 0px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body, html { 
  width: 100%; height: 100%; 
  background: #000; overflow: hidden; position: fixed; inset: 0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
  user-select: none;
}

button { font-family: inherit; cursor: pointer; outline: none; border: 0; background: none; color: inherit; }
.hidden { display: none !important; }

/* =======================================================
   FORCE LANDSCAPE CSS
   ======================================================= */
#app-wrapper {
  position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh; overflow: hidden; background: #000;
  display: flex; flex-direction: column;
}

/* =======================================================
   TEXT SIZES - (YAHAN SE AAP SIZE CHANGE KAR SAKTE HAIN)
   ======================================================= */
/* Landscape View (PC/Tablet) ke liye Text Size */
.score { 
  font-size: 28vw; /* MAIN SCORE SIZE (Isko 25vw ya 35vw karke dekhein) */
  font-weight: 900; color: white; line-height: 1; 
  transition: text-shadow 0.3s ease, transform 0.1s;
}
.player-name { 
  font-size: 8vw; /* TEAM NAME SIZE */
}

/* Portrait View (Mobile force-landscape) ke liye Text Size */
@media screen and (orientation: portrait) {
  #app-wrapper {
    width: 100vh; height: 100vw;
    top: 0; left: 100vw;
    transform: rotate(90deg); transform-origin: top left;
  }
  .score { 
    font-size: 38vh; /* MOBILE PAR MAIN SCORE SIZE (Isko badal kar fit karein) */
  }
  .player-name { 
    font-size: 8vh;  /* MOBILE PAR TEAM NAME SIZE */
  }
}

/* ---------- MAIN SPLIT SCREEN APP ---------- */
#main-app { display: flex; flex-direction: row; height: 100%; width: 100%; position: relative; }

.side { 
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
  position: relative; cursor: pointer; transition: background-color 0.3s, filter 0.2s; 
}
.side:active { filter: brightness(0.9); }
.side-left { background-color: var(--bg-left); }
.side-right { background-color: var(--bg-right); }

/* Serving Indicator */
.serve-indicator { position: absolute; top: 5%; font-size: 2.5rem; opacity: 0; transition: 0.3s; z-index: 10;}
.serving .serve-indicator { opacity: 1; animation: bounce 1s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

/* Player Info with Neon Glow */
.player-info { text-align: center; color: white; position: absolute; top: 3%; z-index: 5; width: 100%; }
.player-name { 
  font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
  animation: neon-pulse 1.5s infinite alternate;
  text-shadow: 0 0 5px #fff, 0 0 15px rgba(255,255,255,0.7);
}
@keyframes neon-pulse {
  0% { opacity: 0.8; }
  100% { opacity: 1; transform: scale(1.02); }
}

/* Fixed Huge Score Text with Streak Glow (White glow for any BG) */
.score-box { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.score:active { transform: scale(0.95); }
.score-left-glow { text-shadow: 0 0 var(--streak-glow-a) #fff, 0 0 calc(var(--streak-glow-a) * 1.5) #fff, 0 10px 20px rgba(0,0,0,0.5); }
.score-right-glow { text-shadow: 0 0 var(--streak-glow-b) #fff, 0 0 calc(var(--streak-glow-b) * 1.5) #fff, 0 10px 20px rgba(0,0,0,0.5); }

/* Floating UI Pills */
.floating-pill { 
  position: absolute; left: 50%; transform: translateX(-50%); 
  background: var(--pill-bg); border-radius: 50px; 
  box-shadow: var(--pill-shadow); display: flex; align-items: center; justify-content: center; z-index: 50; 
}

/* Center Set Pill (Top) */
.center-sets { 
  top: 15px; padding: 10px 25px; border-radius: 30px; 
  text-align: center; background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 4px 10px rgba(0,0,0,0.2);
}
#current-set-label { font-size: 1.2rem; font-weight: 900; color: #111827; letter-spacing: 1px;}
.target-score-info { font-size: 0.8rem; color: #4b5563; font-weight: 800; }

/* =======================================================
   CENTER SETS WON (YELLOW BOX AREA)
   YAHAN SE SET WIN KA TEXT SIZE BADLEIN
   ======================================================= */
.sets-won-center {
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  flex-direction: column; padding: 10px 25px; border-radius: 20px;
  background: rgba(0,0,0,0.8); color: white; border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 60;
  
  /* SET WIN AREA OVERALL SIZE: */
  font-size: 2.9rem; /* Isko kam/zyada karein box ka size chhota/bada karne ke liye */
}
.sets-won-title { font-size: 0.6em; font-weight: 800; color: #aaa; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase;}
.sets-won-scores { font-weight: 900; font-size: 1.2em; display: flex; gap: 15px; align-items: center;}
.set-score-a { color: var(--bg-left); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
.set-score-b { color: var(--bg-right); text-shadow: 0 0 5px rgba(255,255,255,0.5); }


/* Bottom Menu Pill */
.bottom-controls { bottom: 15px; padding: 10px 25px; gap: 25px; }
.bottom-controls button { font-size: 1.5rem; color: var(--icon-color); transition: 0.2s; font-weight: 900;}
.bottom-controls button:active { transform: scale(0.85); }

/* ---------- OVERLAYS (Setup, Modals) ---------- */
.overlay { 
  position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; 
  padding: 20px; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); 
}
.box { 
  width: 100%; max-width: 440px; color: white; background: #111827; 
  border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; 
  box-shadow: 0 20px 50px rgba(0,0,0,.9); 
}
.modal-title { text-align: center; font-size: 1.4rem; font-weight: 900; margin-bottom: 20px; color: var(--accent); text-transform: uppercase;}
.field { margin-bottom: 15px; }
.field > label { display: block; margin-bottom: 8px; font-size: .8rem; font-weight: 800; color: #9ca3af; text-transform: uppercase;}
.field select { 
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); 
  background: rgba(0,0,0,0.3); color: white; font-size: 1rem; font-weight: bold; outline: none; 
}

/* Color Picker & Name Row */
.color-picker-row { display: flex; gap: 10px; }
.color-picker-row input[type=text] { 
  flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); 
  background: rgba(0,0,0,0.3); color: white; font-size: 1rem; font-weight: bold; outline: none; 
}
.color-picker-row input[type=color] { 
  width: 50px; height: 100%; min-height: 46px; border: none; border-radius: 12px; 
  cursor: pointer; background: transparent; 
}
.color-picker-row input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker-row input[type=color]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; }

.team-inputs { display: flex; flex-direction: column; gap: 12px; }
.segmented { display: flex; gap: 5px; padding: 5px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,0.2); }
.segmented button { flex: 1; padding: 11px 6px; border-radius: 10px; font-size: .85rem; font-weight: 800; color: #9ca3af; transition: 0.2s;}
.segmented button.active { background: var(--accent); color: #000; box-shadow: 0 0 10px rgba(34, 211, 167, 0.5);}
.btn-primary { width: 100%; padding: 15px; border-radius: 12px; background: #10b981; color: #fff; font-size: 1rem; font-weight: 900; margin-top:10px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);}
.btn-primary:active { transform: scale(0.97); }
.btn-ghost { width: 100%; padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.2); color: #9ca3af; font-size: .9rem; font-weight: 800;}
</style>
</head>
<body>

<div id="app-wrapper">

  <!-- ============ SETUP SCREEN (First Screen) ============ -->
  <div id="setup-screen" class="overlay">
    <div class="box">
      <div class="modal-title">Volleyball Match Setup</div>
      
      <div class="team-inputs">
        <div class="field">
          <label>Team 1 Name & Color</label>
          <div class="color-picker-row">
            <input type="text" id="setup-a-name" value="TEAM 1" maxlength="12" autocomplete="off">
            <input type="color" id="setup-a-color" value="#4ade80">
          </div>
        </div>
        <div class="field">
          <label>Team 2 Name & Color</label>
          <div class="color-picker-row">
            <input type="text" id="setup-b-name" value="TEAM 2" maxlength="12" autocomplete="off">
            <input type="color" id="setup-b-color" value="#f87171">
          </div>
        </div>
      </div>
      
      <div class="field" style="margin-top: 10px;">
        <label>Match Format</label>
        <div class="segmented" id="format-seg">
          <button type="button" data-value="3">Best of 3</button>
          <button type="button" data-value="5" class="active">Best of 5</button>
        </div>
      </div>

      <div class="field">
        <label>Final Set Target Score</label>
        <select id="setup-target">
          <option value="15">Play to 15 (Standard)</option>
          <option value="25">Play to 25</option>
        </select>
      </div>

      <button class="btn-primary" id="btn-start">Start Match 🚀</button>
    </div>
  </div>
  
  <!-- ============ MAIN UI APP ============ -->
  <div id="main-app" class="hidden">
    
    <!-- Top Center Set Info -->
    <div class="floating-pill center-sets">
      <div id="current-set-label">SET 1</div>
      <div class="target-score-info" id="target-info">To 25 (Win by 2)</div>
    </div>

    <!-- CENTER SETS WON PILL (Yellow Box Area) -->
    <div class="floating-pill sets-won-center">
      <div class="sets-won-title">SETS WON</div>
      <div class="sets-won-scores">
        <span class="set-score-a" id="sets-a">0</span> 
        <span style="color:#777">-</span> 
        <span class="set-score-b" id="sets-b">0</span>
      </div>
    </div>

    <!-- Left Side -->
    <div class="side side-left" id="side-a">
      <div class="serve-indicator">🏐</div>
      <div class="player-info">
        <div class="player-name name-left" id="name-a">TEAM 1</div>
      </div>
      <div class="score-box" id="click-a">
        <div class="score score-left-glow" id="score-a">0</div>
      </div>
    </div>

    <!-- Right Side -->
    <div class="side side-right" id="side-b">
      <div class="serve-indicator">🏐</div>
      <div class="player-info">
        <div class="player-name name-right" id="name-b">TEAM 2</div>
      </div>
      <div class="score-box" id="click-b">
        <div class="score score-right-glow" id="score-b">0</div>
      </div>
    </div>

    <!-- Floating Bottom Controls -->
    <div class="floating-pill bottom-controls">
      <button id="btn-settings" title="Settings">⚙️</button>
      <button id="btn-undo" title="Undo">↩</button>
      <button id="btn-sub-a" title="Minus T1 Point" style="color:var(--icon-color); font-weight:800">-1</button>
      <button id="btn-sub-b" title="Minus T2 Point" style="color:var(--icon-color); font-weight:800">-1</button>
      <button id="btn-reset" title="Reset Match">🔄</button>
    </div>
  </div>

  <!-- ============ SETTINGS MODAL ============ -->
  <div id="modal-settings" class="overlay hidden">
    <div class="box">
      <div class="modal-title">Match Settings</div>
      <div class="team-inputs">
        <div class="field">
          <label>Team 1 Name & Color</label>
          <div class="color-picker-row">
            <input type="text" id="settings-a-name" maxlength="12" autocomplete="off">
            <input type="color" id="settings-a-color">
          </div>
        </div>
        <div class="field">
          <label>Team 2 Name & Color</label>
          <div class="color-picker-row">
            <input type="text" id="settings-b-name" maxlength="12" autocomplete="off">
            <input type="color" id="settings-b-color">
          </div>
        </div>
      </div>
      <div class="field" style="margin-top: 10px;">
        <label>Final Set Target Score</label>
        <select id="settings-target">
          <option value="15">Play to 15</option>
          <option value="25">Play to 25</option>
        </select>
      </div>
      <button class="btn-primary" id="btn-save-settings">Save & Resume</button>
      <button class="btn-ghost" id="btn-cancel-settings">Cancel</button>
    </div>
  </div>

  <!-- ============ MATCH OVER MODAL ============ -->
  <div id="modal-set" class="overlay hidden">
    <div class="box" style="text-align:center;">
      <div class="modal-title" id="modal-title">Set Complete</div>
      <div style="font-size: 3.5rem; font-weight: 900; margin: 15px 0;" id="modal-score">25 – 23</div>
      <div style="font-size: 1.2rem; font-weight: 800;" id="modal-desc">Team 1 wins the set!</div>
      <button class="btn-primary" id="btn-next-set">Start Next Set</button>
      <button class="btn-ghost" id="btn-undo-modal">↩ Undo Last Point</button>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // Load Saved Data from LocalStorage
  document.getElementById('setup-a-name').value = localStorage.getItem('vb_teamA') || 'TEAM 1';
  document.getElementById('setup-b-name').value = localStorage.getItem('vb_teamB') || 'TEAM 2';
  document.getElementById('setup-a-color').value = localStorage.getItem('vb_colorA') || '#4ade80';
  document.getElementById('setup-b-color').value = localStorage.getItem('vb_colorB') || '#f87171';
  document.getElementById('setup-target').value = localStorage.getItem('vb_target') || '15';

  // State
  let selectedFormat = 5; 
  let state = {
    teamA: 'TEAM 1', teamB: 'TEAM 2', 
    colorA: '#4ade80', colorB: '#f87171',
    format: 5, currentSet: 1,
    scoreA: 0, scoreB: 0, setsA: 0, setsB: 0, server: 'A', status: 'setup',
    finalTarget: 15
  };
  
  let undoStack = [];
  let streakA = 0;
  let streakB = 0;

  const els = {
    setupScreen: document.getElementById('setup-screen'),
    app: document.getElementById('main-app'),
    modalSet: document.getElementById('modal-set'),
    modalSettings: document.getElementById('modal-settings'),
    
    sideA: document.getElementById('side-a'), sideB: document.getElementById('side-b'),
    nameA: document.getElementById('name-a'), nameB: document.getElementById('name-b'),
    scoreA: document.getElementById('score-a'), scoreB: document.getElementById('score-b'),
    setsA: document.getElementById('sets-a'), setsB: document.getElementById('sets-b'),
    currentSet: document.getElementById('current-set-label'),
    targetInfo: document.getElementById('target-info'),
    
    // Setup inputs
    inputSetupA: document.getElementById('setup-a-name'),
    inputSetupB: document.getElementById('setup-b-name'),
    inputSetupColorA: document.getElementById('setup-a-color'),
    inputSetupColorB: document.getElementById('setup-b-color'),
    inputSetupTarget: document.getElementById('setup-target'),
    
    // Settings inputs
    inputSettingsA: document.getElementById('settings-a-name'),
    inputSettingsB: document.getElementById('settings-b-name'),
    inputSettingsColorA: document.getElementById('settings-a-color'),
    inputSettingsColorB: document.getElementById('settings-b-color'),
    inputSettingsTarget: document.getElementById('settings-target')
  };

  // Setup Format toggle
  document.getElementById('format-seg').addEventListener('click', function(e) {
    if(e.target.tagName !== 'BUTTON') return;
    selectedFormat = parseInt(e.target.dataset.value);
    Array.from(this.children).forEach(b => b.classList.toggle('active', b === e.target));
  });

  // Start Match Logic
  document.getElementById('btn-start').addEventListener('click', () => {
    state.teamA = els.inputSetupA.value || 'TEAM 1';
    state.teamB = els.inputSetupB.value || 'TEAM 2';
    state.colorA = els.inputSetupColorA.value || '#4ade80';
    state.colorB = els.inputSetupColorB.value || '#f87171';
    state.finalTarget = parseInt(els.inputSetupTarget.value);
    state.format = selectedFormat;
    state.status = 'playing';

    saveData();
    els.setupScreen.classList.add('hidden');
    els.app.classList.remove('hidden');
    render();
  });

  function targetScore() { 
    return state.currentSet === state.format ? state.finalTarget : 25; 
  }
  
  function setsNeeded() { return Math.ceil(state.format / 2); }

  function saveData() {
    localStorage.setItem('vb_teamA', state.teamA);
    localStorage.setItem('vb_teamB', state.teamB);
    localStorage.setItem('vb_colorA', state.colorA);
    localStorage.setItem('vb_colorB', state.colorB);
    localStorage.setItem('vb_target', state.finalTarget);
  }

  function updateVisuals() {
    // Update Dynamic CSS Variables for colors
    document.documentElement.style.setProperty('--bg-left', state.colorA);
    document.documentElement.style.setProperty('--bg-right', state.colorB);

    // Update Streak Glow effect (max glow limit)
    let glowA = Math.min(streakA * 8, 40);
    let glowB = Math.min(streakB * 8, 40);
    els.scoreA.style.setProperty('--streak-glow-a', glowA + 'px');
    els.scoreB.style.setProperty('--streak-glow-b', glowB + 'px');
  }

  function pushUndo() {
    undoStack.push(JSON.parse(JSON.stringify(state)));
    if (undoStack.length > 50) undoStack.shift();
  }

  function undo() {
    if (undoStack.length === 0) return;
    state = undoStack.pop();
    streakA = 0; streakB = 0; 
    els.modalSet.classList.add('hidden');
    render();
  }

  function render() {
    els.nameA.textContent = state.teamA; els.nameB.textContent = state.teamB;
    els.scoreA.textContent = state.scoreA; els.scoreB.textContent = state.scoreB;
    els.setsA.textContent = state.setsA; els.setsB.textContent = state.setsB;
    
    els.currentSet.textContent = state.currentSet === state.format ? 'FINAL SET' : 'SET ' + state.currentSet;
    els.targetInfo.textContent = 'To ' + targetScore() + ' (Win by 2)';
    
    els.sideA.classList.toggle('serving', state.server === 'A');
    els.sideB.classList.toggle('serving', state.server === 'B');
    
    updateVisuals();
  }

  function addPoint(side) {
    if (state.status !== 'playing') return;
    pushUndo();
    
    if (side === 'A') { 
      state.scoreA++; state.server = 'A'; 
      streakA++; streakB = 0;
    } else { 
      state.scoreB++; state.server = 'B'; 
      streakB++; streakA = 0;
    }
    
    render(); checkWin();
  }

  function subPoint(side) {
    if (state.status !== 'playing') return;
    if (side === 'A' && state.scoreA > 0) { pushUndo(); state.scoreA--; streakA = 0;}
    else if (side === 'B' && state.scoreB > 0) { pushUndo(); state.scoreB--; streakB = 0;}
    render();
  }

  function checkWin() {
    const t = targetScore();
    const aWin = state.scoreA >= t && (state.scoreA - state.scoreB) >= 2;
    const bWin = state.scoreB >= t && (state.scoreB - state.scoreA) >= 2;
    if (!aWin && !bWin) return;

    state.status = 'break';
    if (aWin) state.setsA++; else state.setsB++;
    
    streakA = 0; streakB = 0; // Reset streaks on set end

    const matchOver = state.setsA >= setsNeeded() || state.setsB >= setsNeeded();
    if (matchOver) state.status = 'finished';

    document.getElementById('modal-score').textContent = `${state.scoreA} – ${state.scoreB}`;
    document.getElementById('modal-desc').textContent = `${aWin ? state.teamA : state.teamB} wins!`;
    
    if (matchOver) {
      document.getElementById('modal-title').textContent = '🏆 MATCH OVER 🏆';
      document.getElementById('btn-next-set').textContent = 'Main Menu (Reset)';
      document.getElementById('btn-next-set').onclick = goToSetup;
    } else {
      document.getElementById('modal-title').textContent = 'SET ' + state.currentSet + ' COMPLETE';
      document.getElementById('btn-next-set').textContent = 'Start Next Set';
      document.getElementById('btn-next-set').onclick = startNextSet;
    }
    els.modalSet.classList.remove('hidden');
    render();
  }

  function startNextSet() {
    if (state.status !== 'break') return;
    undoStack = []; state.currentSet++; state.scoreA = 0; state.scoreB = 0; state.status = 'playing';
    els.modalSet.classList.add('hidden'); render();
  }

  function goToSetup() {
    state.currentSet = 1; state.scoreA = 0; state.scoreB = 0; state.setsA = 0; state.setsB = 0; 
    state.status = 'setup'; undoStack = []; streakA = 0; streakB = 0;
    
    els.modalSet.classList.add('hidden'); 
    els.app.classList.add('hidden');
    els.setupScreen.classList.remove('hidden');
  }

  // Bind Clicks
  document.getElementById('click-a').addEventListener('click', () => addPoint('A'));
  document.getElementById('click-b').addEventListener('click', () => addPoint('B'));
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-undo-modal').addEventListener('click', undo);
  document.getElementById('btn-sub-a').addEventListener('click', () => subPoint('A'));
  document.getElementById('btn-sub-b').addEventListener('click', () => subPoint('B'));
  
  document.getElementById('btn-reset').addEventListener('click', () => { 
    if(confirm('Are you sure you want to end this match and go back to setup?')) goToSetup(); 
  });

  // Settings Menu (in-game changes)
  document.getElementById('btn-settings').addEventListener('click', () => {
    els.inputSettingsA.value = state.teamA;
    els.inputSettingsB.value = state.teamB;
    els.inputSettingsColorA.value = state.colorA;
    els.inputSettingsColorB.value = state.colorB;
    els.inputSettingsTarget.value = state.finalTarget;
    els.modalSettings.classList.remove('hidden');
  });

  document.getElementById('btn-cancel-settings').addEventListener('click', () => {
    els.modalSettings.classList.add('hidden');
  });

  document.getElementById('btn-save-settings').addEventListener('click', () => {
    state.teamA = els.inputSettingsA.value || 'TEAM 1';
    state.teamB = els.inputSettingsB.value || 'TEAM 2';
    state.colorA = els.inputSettingsColorA.value || '#4ade80';
    state.colorB = els.inputSettingsColorB.value || '#f87171';
    state.finalTarget = parseInt(els.inputSettingsTarget.value);
    
    saveData();
    els.modalSettings.classList.add('hidden');
    render();
  });

})();
</script>
</body>
</html>
